name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=low
      - run: pnpm check:chapters
      - run: pnpm build
      - name: Use the runner's installed Chrome
        run: echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Install the audio checker
        run: |
          if ! command -v ffmpeg; then
            sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify sections and immutable paintings
        run: node scripts/ci_sections.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: section-checks
          path: |
            work/checks/**/result.json
            work/checks/**/sheet-*.jpg
          if-no-files-found: warn
          retention-days: 7
      - name: Package the production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'farzinnasiri/visual-shahnameh' && github.actor == 'farzinnasiri'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cloudflare-build
          path: .cloudflare/output/v0/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'farzinnasiri/visual-shahnameh' && github.actor == 'farzinnasiri'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://shahnameh.world
    steps:
      # No application checkout, build scripts, shared cache or PR artifacts.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cloudflare-build
          path: .cloudflare/output/v0/
      - name: Install the pinned deployment CLI without lifecycle scripts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/deployer"
          cat > "$RUNNER_TEMP/deployer/package.json" <<'JSON'
          {"private":true,"dependencies":{"cf":"1.0.0-beta.19"},"overrides":{"undici":"7.30.1","zod":"4.6.6"}}
          JSON
          npm install --prefix "$RUNNER_TEMP/deployer" --ignore-scripts --no-fund --no-audit
      - name: Check the exact build
        run: '"$RUNNER_TEMP/deployer/node_modules/.bin/cf" deploy --prebuilt --mode production --dry-run'
        env:
          CF_SEND_TELEMETRY: 'false'
      - name: Deploy the exact build
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN to the production environment secrets.'
            exit 1
          fi
          "$RUNNER_TEMP/deployer/node_modules/.bin/cf" deploy --prebuilt --mode production
        env:
          CF_SEND_TELEMETRY: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
