name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=low
      - run: pnpm check:chapters
      - run: pnpm test:portrait:geometry
      - run: pnpm build
      - name: Use the runner's installed Chrome
        run: echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: pnpm test:portrait:browser
      - name: Install the audio checker
        timeout-minutes: 6
        run: |
          if ! command -v ffmpeg; then
            # Use Ubuntu's primary mirror rather than the Azure mirror.
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 ffmpeg
          fi
      - name: Verify sections and immutable paintings
        run: node scripts/ci_sections.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: section-checks
          path: |
            work/checks/**/result.json
            work/checks/**/sheet-*.jpg
            work/portrait-reader/**
          if-no-files-found: warn
          retention-days: 7
      - name: Package the production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'farzinnasiri/visual-shahnameh' && github.actor == 'farzinnasiri'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-build
          path: .cloudflare/output/v0/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'farzinnasiri/visual-shahnameh' && github.actor == 'farzinnasiri'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://shahnameh.world
    steps:
      # No application checkout, build scripts, shared cache or PR artifacts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-build
          path: .cloudflare/output/v0/
      - name: Install the pinned deployment CLI without lifecycle scripts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/deployer"
          cat > "$RUNNER_TEMP/deployer/package.json" <<'JSON'
          {"private":true,"dependencies":{"cf":"1.0.0-beta.28"},"overrides":{"undici":"7.30.1","zod":"4.6.6"}}
          JSON
          npm install --prefix "$RUNNER_TEMP/deployer" --ignore-scripts --no-fund --no-audit
      - name: Check the exact build
        run: '"$RUNNER_TEMP/deployer/node_modules/.bin/cf" deploy --prebuilt --mode production --dry-run'
        env:
          CF_SEND_TELEMETRY: 'false'
      - name: Deploy the exact build
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN to the production environment secrets.'
            exit 1
          fi
          "$RUNNER_TEMP/deployer/node_modules/.bin/cf" deploy --prebuilt --mode production
        env:
          CF_SEND_TELEMETRY: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
